<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Scooter</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Helvetica, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #071619; color: #fff; }
    main { max-width: 680px; text-align: center; }
    p { color: rgba(255, 255, 255, .68); font-size: 1rem; line-height: 1.6; }
    h1 { margin: 0 0 16px; color: #f2d24b; font-size: clamp(3rem, 12vw, 8rem); line-height: .9; }
    a { display: inline-block; margin-top: 18px; padding: 14px 20px; border: 1px solid #f2d24b; border-radius: 999px; color: #f2d24b; text-decoration: none; font-size: .875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    a:hover, a:focus-visible { background: #f2d24b; color: #071619; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you’re looking for isn’t here.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
